train_script: scripts/train_sac_lagrangian.py

# Lagrangian SAC Stage 1g (prepos) -- clearance-cost replacement test.
# Goal: remove SAC-style collision hard reward penalty, keep collision terminal,
# and use a continuous clearance cost instead of binary collision cost.

# Runtime / env count.
num_envs: 16
horizon: 100
render: false
seed: 0
use_axis_resid_obs: true
exclude_ee_from_physx_self_collision: false

# Collection / update cadence.
n_epochs: 120
n_steps_per_epoch: 1600
n_steps_per_fit: 16
utd: null
critic_warmup_transitions: null
n_eval_episodes: 16

# Optimizer / entropy.
lr_actor: 7e-5
lr_critic: 3e-4
lr_alpha: 3e-4
alpha_max: 0.15
target_entropy: -7
actor_grad_clip: null

# Base env.
initial_joint_noise: 0.1
preinsert_success_pos_threshold: 0.10
preinsert_offset: null

geom_stage: prepos
geom_d_target_neg: -0.08
geom_d_target_pos: 0.03
geom_d_target_ramp_start: 0
geom_d_target_ramp_end: 20

geom_d_sat: 0.30
geom_radial_sat: 1.5

geom_d_th: 0.030
geom_r_tip_th: 0.030
geom_r_max_th: 0.030
geom_axis_th: 0.400
geom_insert_d_ins: 0.025
geom_insert_r_max_th: 0.025
geom_pen_th: 0.001

# Reward weights -- same task reward as the previous S1g tests.
rew_geom_d: 8.0
rew_geom_radial_tip: 8.0
rew_geom_radial_max: 0.0
rew_geom_axis: 0.0
rew_geom_progress: 0.0
rew_geom_advance: 0.0

geom_gate_radial_sigma: 0.025
geom_gate_axis_sigma: 0.30
geom_gate_penetration_sigma: null
geom_d_gate_mode: "off"

rew_geom_penetration: 0.0
rew_geom_soft_success: 0.0
geom_soft_d_sigma: 0.020
geom_soft_radial_sigma: 0.015
geom_soft_axis_sigma: 0.30
geom_soft_penetration_sigma: null

rew_geom_bad_entry: 0.0
geom_bad_entry_radial_safe: 0.014
geom_bad_entry_axis_safe: 0.10
geom_bad_entry_pen_safe: 0.00075

# CMDP cost signal.
# clearance cost = clamp((margin - min_clearance) / margin, 0, 1) per step.
# Collision remains absorbing/terminal, but no longer gets the SAC hard reward cliff.
cost_signal: clearance
clearance_cost_margin: 0.02
keep_collision_reward_penalty: false

# Lagrangian -- active from the first update.
# Clearance is a per-step continuous cost. The first probe showed dangerous
# policies around rollout_ep_cost ~= 1.2, so 0.5 should make lambda increase
# while leaving some room for transient near-clearance motion.
cost_limit_per_ep: 0.5
lambda_update_mode: rollout_episode_rate
min_lambda_update_episodes: 16
lr_lambda: 5e-2
lambda_max: 100.0
lambda_min: 0.0
init_log_lambda: 0
damp_scale: 0.0
gamma_cost: 0.7

# Regularization.
rew_action: 0.005
rew_home: 0.00075
home_weights: "1,1,1,1,0.75,0.5,0.5"

terminal_hold_bonus: 0.0
hold_success_steps: 10

clearance_hard: 0.0
proxy_arm_radius: 0.06
proxy_ee_radius: 0.04

# Cold-start, no checkpoint.
load_agent: null
actor_only_warmstart: false
keep_replay: false

wandb_project: bimanual_peghole
wandb_entity: safe_rl_2026_lund
wandb_run_name: lag_S1g_prepos_active_clearance05_nocollpen_20260516_seed0
wandb_group: lag_geom_stage1_active_clearance05_nocollpen_20260516
no_wandb: false
