train_script: scripts/train_sac_lagrangian.py

# Lagrangian SAC Stage 1g (prepos) — ACTIVE overlay (d-atacom style, 2026-05-16).
#
# 跟 lag_stage1_prepos_active_verify.yaml 的差异仅一行:
#   init_log_lambda: -10  →  0    (λ_init = exp(0) = 1.0)
#
# 之前 active_verify 的 init_log_lambda=-10 让 λ 一直撞 C-soft 守卫 (<= -9.9),
# actor 看不到任何 Lagrangian 信号, 训练实际等价 pure SAC. λ 即使被 dual ascent
# 推动也最多到 ~4.79e-5 (log_λ=-9.95), 仍 < -9.9, C-soft 一直短路. 那一轮只能
# 证明 "frozen-λ + active dual ascent != broken", 不能证明 "active LagSAC works".
#
# 这版用 d-atacom 风格 init: λ_init = 1.0 (类似 d-atacom 的 softplus(0)≈0.693),
# Lagrangian 从第 1 步就实际工作, actor loss 一开始就含 +λ·Q_C 项. C-soft 不会
# 在 epoch 0 触发 (log_λ=0 > -9.9). 真正能验证 active LagSAC.
#
# Safety overlay 风格 (跟 d-atacom Tiago 一致):
#   keep_collision_reward_penalty=true (默认): collision 仍触发 r_min/(1-γ) reward 罚
#   cost_signal=collision: collision 也作为 explicit cost, λ 提供额外 safety 压力
#   absorbing: 保留 (MDP 不变)
# 这是 d-atacom 的 default 用法, Lagrangian 是 supplementary safety, 不是 reward replacement.
# Option B (`keep_collision_reward_penalty: false`) 是 "Lagrangian 替换 reward shaping"
# 的实验, 风险更高, 留作下一步.
#
# Invariants:
#   1. n_steps_per_epoch = horizon × num_envs = 100 × 16 = 1600
#   2. Stage 1g prepos 不接触 hole, 不传 exclude_ee_from_physx_self_collision
#   3. seed=0 (跟 SAC Stage 1g / frozen diagnostic / active_verify 一致, 便于对比)

# Runtime / env count.
num_envs: 16
horizon: 100
render: false
seed: 0
use_axis_resid_obs: true
exclude_ee_from_physx_self_collision: false

# Collection / update cadence.
n_epochs: 120
n_steps_per_epoch: 1600          # = horizon × num_envs = 100 × 16
n_steps_per_fit: 16              # one vector-step per fit at num_envs=16
utd: null                        # defaults to n_steps_per_fit → true UTD ≈ 1
critic_warmup_transitions: null
n_eval_episodes: 16

# Optimizer / entropy (cold-start, mirrors sac_stage1_prepos).
lr_actor: 7e-5
lr_critic: 3e-4
lr_alpha: 3e-4
alpha_max: 0.15
target_entropy: -7               # ≈ -act_dim/2 for 14-DoF cold start
actor_grad_clip: null            # 跟 SAC 对齐, cold-start 不能 clip

# Base env.
initial_joint_noise: 0.1
preinsert_success_pos_threshold: 0.10
preinsert_offset: null

geom_stage: prepos
geom_d_target_neg: -0.08
geom_d_target_pos: 0.03
geom_d_target_ramp_start: 0
geom_d_target_ramp_end: 20

geom_d_sat: 0.30
geom_radial_sat: 1.5

geom_d_th: 0.030
geom_r_tip_th: 0.030
geom_r_max_th: 0.030
geom_axis_th: 0.400
geom_insert_d_ins: 0.025
geom_insert_r_max_th: 0.025
geom_pen_th: 0.001

# Reward weights — Stage 1g prepos (跟 SAC / frozen / active_verify 一致).
rew_geom_d: 8.0
rew_geom_radial_tip: 8.0
rew_geom_radial_max: 0.0
rew_geom_axis: 0.0
rew_geom_progress: 0.0
rew_geom_advance: 0.0

geom_gate_radial_sigma: 0.025
geom_gate_axis_sigma: 0.30
geom_gate_penetration_sigma: null
geom_d_gate_mode: "off"

rew_geom_penetration: 0.0
rew_geom_soft_success: 0.0
geom_soft_d_sigma: 0.020
geom_soft_radial_sigma: 0.015
geom_soft_axis_sigma: 0.30
geom_soft_penetration_sigma: null

rew_geom_bad_entry: 0.0
geom_bad_entry_radial_safe: 0.014
geom_bad_entry_axis_safe: 0.10
geom_bad_entry_pen_safe: 0.00075

# CMDP cost signal: collision 同时作为 explicit constraint cost.
# keep_collision_reward_penalty=true (默认): reward 仍含 collision absorbing
# penalty (r_min/(1-γ)). LagSAC 在此基础上叠加 λ·Q_C, 提供 supplementary safety.
cost_signal: collision

# Lagrangian — ACTIVE OVERLAY (d-atacom style).
# cost_limit_per_ep: 0.10 = 每集平均允许 0.10 次双臂自碰撞.
# init_log_lambda: 0  →  λ_init = exp(0) = 1.0 (类似 d-atacom softplus(0)≈0.693)
#   actor loss 从 epoch 1 就含 +1.0·Q_C 项. C-soft 守卫 (log_λ <= -9.9) 不触发.
#   完整 LagSAC dual ascent 正常工作.
# lr_lambda=5e-2: 每 epoch dual update 一次, 量级跟 d-atacom 类似.
# damp_scale=0: 先验证最简单的 vanilla LagSAC, damp 留作 ablation.
cost_limit_per_ep: 0.10
lambda_update_mode: rollout_episode_rate
min_lambda_update_episodes: 16
lr_lambda: 5e-2
lambda_max: 100.0
lambda_min: 0.0
init_log_lambda: 0               # ★ 从 -10 改成 0, λ_init=1.0, 真正激活 Lagrangian
damp_scale: 0.0
gamma_cost: 0.7

# Regularization (跟 SAC / frozen / active_verify 一致).
rew_action: 0.005
rew_home: 0.00075
home_weights: "1,1,1,1,0.75,0.5,0.5"

terminal_hold_bonus: 0.0
hold_success_steps: 10

clearance_hard: 0.0
proxy_arm_radius: 0.06
proxy_ee_radius: 0.04

# Cold-start, 不加载 checkpoint.
load_agent: null
actor_only_warmstart: false
keep_replay: false

wandb_project: bimanual_peghole
wandb_entity: safe_rl_2026_lund
wandb_run_name: lag_S1g_prepos_active_overlay_20260516_seed0
wandb_group: lag_geom_stage1_active_overlay_20260516
no_wandb: false
