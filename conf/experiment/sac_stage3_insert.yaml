train_script: scripts/train_sac.py

# SAC Stage 3g (insert) — geom_stage 主线, 从 Stage 2g best_hold warm-start (SAC v8).
#
# 目标: peg 真正进入 hole (d > geom_insert_d_ins=2.5cm), 同时 radial_max 与
# penetration 都达标. 5-channel reward 协同:
#   1. r_linear (radial_max + axis): always-on 拉对齐
#   2. r_advance (PBRS Δφ, w=25):  主推进信号, 只在 aligned 时给奖
#   3. r_pen (-20·pen):             直接罚穿模
#   4. r_dwell (4-项 Gaussian):     clean target 处持续正奖励, 防 advance 后期梯度消失
#   5. r_bad_entry (w=0.3):         d>0 但 misaligned 时惩罚, 强制 task ordering
#
# geom_stage=insert 自动启用 41D obs (joint_pos[14] + joint_vel[14]
#   + pos_vec[3] + axis_resid[3] + d[1] + radial_vec[3] + peg_in_hole[3]).
#
# Invariants (README):
#   1. n_steps_per_epoch = horizon × num_envs = 200 × 16 = 3200
#   2. exclude_ee_from_physx_self_collision 必传 (peg 进入 hole, 必须绕过双臂自碰撞拦截)
#   3. seed=1 (verified; seed=0 七次失败)
#   4. insert_mask 含 penetration_max < geom_pen_th (1mm), 防止穿模假成功被选为 best_hold

# Runtime / env count.
num_envs: 16
horizon: 200
render: false
seed: 1
use_axis_resid_obs: true
exclude_ee_from_physx_self_collision: true

# SAC collection / update cadence.
n_epochs: 80
n_steps_per_epoch: 3200          # = horizon × num_envs = 200 × 16
n_steps_per_fit: 16              # one vector-step per fit at num_envs=16
utd: null                        # defaults to n_steps_per_fit → true UTD ≈ 1
critic_warmup_transitions: 30000
n_eval_episodes: 16

# Optimizer / entropy (fine-tuning from Stage 2g, very low lr_actor).
lr_actor: 1e-5
lr_critic: 3e-4
lr_alpha: 3e-4
alpha_max: 0.015
target_entropy: -7               # ≈ -act_dim/2 for 14-DoF

# Base env.
initial_joint_noise: 0.1
preinsert_success_pos_threshold: 0.10
preinsert_offset: null           # auto-synced to abs(geom_d_target_neg) = 0.08

# Geom Stage 3g reward design (SAC v8 5-channel).
# insert 在 Stage 2g 基础上新增:
#   rew_geom_advance (PBRS Δφ, 对齐门控推进)
#   rew_geom_penetration (直接罚穿模)
#   rew_geom_soft_success (4-项 Gaussian dwell well)
#   rew_geom_bad_entry (task ordering: d>0 但 misaligned 时惩罚)
# 三阶段分工:
#   Stage 1g prepos  : rew_geom_d + rew_geom_radial_tip
#   Stage 2g preaxis : + rew_geom_radial_max + rew_geom_axis
#   Stage 3g insert  : + rew_geom_advance + rew_geom_penetration + soft_success + bad_entry (本配置)

geom_stage: insert
geom_d_target_neg: -0.08        # 起始目标深度 d = -8cm (preinsert)
geom_d_target_pos: 0.03         # 最终目标深度 d = +3cm (插入)
geom_d_target_ramp_start: 0     # ramp 起始 epoch
geom_d_target_ramp_end: 20      # ramp 结束 epoch (前 20 epoch 线性过渡 d_target)
geom_progress_floor: 0.0        # PBRS progress 下界 (防负奖励截断)

geom_d_sat: 0.30                # 轴向误差 reward 饱和上界 (30cm)
geom_radial_sat: 1.0            # 径向误差 reward 饱和上界 (1m)

# 成功判断阈值 (用于 eval metric 与 best_hold ckpt 选择).
geom_d_th: 0.020                # 轴向深度窗口 ±2cm
geom_r_tip_th: 0.015            # tip 单点径向阈值 1.5cm (比 Stage 2g 更严)
geom_r_max_th: 0.025            # 杆身最大径向阈值 2.5cm
geom_axis_th: 0.300             # 轴对齐阈值
geom_insert_d_ins: 0.025        # insert 成功深度阈值 2.5cm
geom_insert_r_max_th: 0.025     # insert 成功杆身径向阈值 2.5cm
geom_pen_th: 0.001              # clean step 穿模阈值 1mm (insert_mask 必含此项)

# Reward weights — Stage 3g insert (SAC v8).
rew_geom_d: 1.0                 # 轴向深度误差线性罚 (降权, advance 主导推进)
rew_geom_radial_tip: 0.0        # tip 单点径向罚 (insert 阶段关闭, radial_max 接管)
rew_geom_radial_max: 5.0        # 杆身整体径向误差罚 (always-on)
rew_geom_axis: 1.0              # 轴对齐误差罚 (always-on)
rew_geom_progress: 0.0          # state-progress reward (不用)
rew_geom_advance: 25.0          # delta-progress PBRS reward (主推进信号, 对齐门控)

# alignment_gate 参数 (advance 信号的对齐门控 sigma).
geom_gate_radial_sigma: 0.025
geom_gate_axis_sigma: 0.30
geom_gate_penetration_sigma: 0.005  # 穿模也进入 advance gate
geom_d_gate_mode: "off"             # 不对 r_geom_d 做 alignment gating

# 穿模软惩罚 (Stage 3g 核心安全信号).
rew_geom_penetration: 20.0      # 穿模线性罚 (-20 × penetration_max)

# Soft success dwell well (4-项 Gaussian; clean insertion 处持续正奖励).
rew_geom_soft_success: 1.25
geom_soft_d_sigma: 0.018
geom_soft_radial_sigma: 0.009
geom_soft_axis_sigma: 0.15
geom_soft_penetration_sigma: 0.0025

# Bad-entry task-ordering 惩罚 (d>0 但 radial/axis/penetration 不达标时惩罚).
rew_geom_bad_entry: 0.30
geom_bad_entry_radial_safe: 0.014
geom_bad_entry_axis_safe: 0.10
geom_bad_entry_pen_safe: 0.00075

# Cost signal: peg 进入 hole 后仍用 collision 作为双臂安全 cost.
cost_signal: collision

# Regularization.
rew_action: 0.005
rew_home: 0.001
home_weights: "1,1,1,1,0.75,0.5,0.5"  # 每单臂 7 关节权重; 末端关节权重降低

# Hold-N 仅作 eval 指标; terminal_hold_bonus=0 保持 episode 跑满 horizon,
# 防止 success 后 Q-target 边界断崖.
terminal_hold_bonus: 0.0
hold_success_steps: 10

# Sphere-proxy 双臂自碰撞 (OR 联合 PhysX 接触力).
clearance_hard: 0.0
proxy_arm_radius: 0.06
proxy_ee_radius: 0.04

# Warm-start: 从 Stage 2g best_hold actor-only 热启动; critic / α / replay 冷启动.
load_agent: results/checkpoints/saved/Stage2g_preaxis_h150_from_h100_stage1_2026-05-12_19-50-00/best_hold.msh
actor_only_warmstart: true
keep_replay: false

wandb_project: bimanual_peghole
wandb_entity: safe_rl_2026_lund
wandb_run_name: SAC_v8_from_h100_h150_stage2_seed1
wandb_group: geom_repro
no_wandb: false
