train_script: scripts/train_sac_lagrangian.py

# Local tuned Lagrangian SAC Stage 2g (preaxis).
#
# Why this differs from lag_stage2_preaxis.yaml:
# - 2026-05-13 local run proved Stage 1g can learn, but Stage 2g was over-
#   constrained: lambda reached 100 while geom_hold_rate stayed 0.
# - This config keeps the SAC Stage 2g task/reward/env settings, but relaxes
#   the collision CMDP controller so the actor can first recover the preaxis
#   behavior from the Stage 1g warm-start.
# - The original teammate YAML is intentionally left untouched.

num_envs: 16
horizon: 150
render: false
seed: 0
use_axis_resid_obs: true
exclude_ee_from_physx_self_collision: false

n_epochs: 120
n_steps_per_epoch: 2400          # = horizon x num_envs = 150 x 16
n_steps_per_fit: 16
utd: null
critic_warmup_transitions: null  # only initial replay; no extra actor freeze
n_eval_episodes: 16

lr_actor: 3e-5
lr_critic: 3e-4
lr_alpha: 3e-4
alpha_max: 0.05
target_entropy: -7
actor_grad_clip: 1.0

initial_joint_noise: 0.1
preinsert_success_pos_threshold: 0.10
preinsert_offset: null

geom_stage: preaxis
geom_d_target_neg: -0.08
geom_d_target_pos: 0.03
geom_d_target_ramp_start: 0
geom_d_target_ramp_end: 20

geom_d_sat: 0.30
geom_radial_sat: 1.0

geom_d_th: 0.020
geom_r_tip_th: 0.020
geom_r_max_th: 0.025
geom_axis_th: 0.300
geom_insert_d_ins: 0.025
geom_insert_r_max_th: 0.025
geom_pen_th: 0.001

rew_geom_d: 8.0
rew_geom_radial_tip: 2.0
rew_geom_radial_max: 5.0
rew_geom_axis: 1.2
rew_geom_progress: 0.0
rew_geom_advance: 0.0

geom_gate_radial_sigma: 0.025
geom_gate_axis_sigma: 0.30
geom_gate_penetration_sigma: null
geom_d_gate_mode: "off"

rew_geom_penetration: 0.0

rew_geom_soft_success: 0.0
geom_soft_d_sigma: 0.020
geom_soft_radial_sigma: 0.015
geom_soft_axis_sigma: 0.30
geom_soft_penetration_sigma: null

rew_geom_bad_entry: 0.0
geom_bad_entry_radial_safe: 0.014
geom_bad_entry_axis_safe: 0.10
geom_bad_entry_pen_safe: 0.00075

cost_signal: collision
keep_collision_reward_penalty: true

# Tuned CMDP controller.
# Previous run used limit=0.10, lr_lambda=0.05, lambda_max=100, init_lambda~2.7,
# gamma_cost=0.99; it made Stage 2 too conservative before the task recovered.
cost_limit_per_ep: 0.75
lambda_update_mode: q_cost
damp_scale: 1.0
min_lambda_update_episodes: 16
lr_lambda: 5e-3
lambda_max: 20.0
lambda_min: 0.0
init_log_lambda: -2.3             # lambda_init ~= 0.10
gamma_cost: 0.7

rew_action: 0.005
rew_home: 0.00075
home_weights: "1,1,1,1,0.75,0.5,0.5"

terminal_hold_bonus: 0.0
hold_success_steps: 10

clearance_hard: 0.0
proxy_arm_radius: 0.06
proxy_ee_radius: 0.04
enable_table_collision: true
table_collision_terminates: true
table_z: 0.0
table_clearance_hard: 0.0
table_clearance_cost_margin: 0.03

# Use the successful local Lagrangian Stage 1g checkpoint, not the current
# flat results/best_hold_lag.msh (which may point to a later failed stage).
load_agent: results/checkpoints/saved/LagSAC_stage1g_prepos_lag_local_compare_20260513/best_hold_lag.msh
actor_only_warmstart: true
keep_replay: false

wandb_project: bimanual_peghole
wandb_entity: miaoxu010522-lund
wandb_run_name: lag_S2g_preaxis_tuned_from_stage1_seed0
wandb_group: lag_geom_stage2_preaxis_local_tuned
no_wandb: false
