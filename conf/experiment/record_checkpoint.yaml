train_script: scripts/record_geom_video.py

# Cluster (Hydra+Apptainer) checkpoint 录制配置 — 配合 scripts/record_geom_video.py
#
# 2026-05-24 migration:
#   旧版指向 scripts/record_video.py(已删除), 它支持目录批量录制
#   (checkpoint_dir + 自动遍历所有 .msh). record_geom_video.py 是单 agent
#   录制 (--agent_path), 因此原来的 checkpoint_dir / 部分 env 参数不再适用.
#
# 用法 (cluster):
#   python scripts/train_hydra.py --multirun experiment@train=record_checkpoint \
#       train.agent_path=results/checkpoints/saved/.../best_hold.msh \
#       train.tag=stage3g_insert
#
# 录制多个 ckpt: 多次调用 train_hydra (或外层 shell 循环), 每次传一个 agent_path.

# --- 单 ckpt 路径 (必须在 invocation 时覆盖) ---
# 路径相对于容器内项目根目录 /workspace/Safe_RL_Peg_in_hole
agent_path: results/checkpoints/saved/Stage3g_insert_h200_from_h100_h150_stage2_2026-05-12_21-01-11/best_hold.msh

# --- env (record_geom_video 接受的子集) ---
num_envs: 2              # cloner bug 要求 >= 2; 录制只用 viz_env_idx=0
hold_success_steps: 10
rew_home: 0.0005

# --- 录制参数 ---
n_episodes: 1            # 每个 agent 录制的 episode 数
viz_env_idx: 0
# output_dir 不设置: 使用 record_geom_video.py 默认 results/videos
fps: 30
width: 1280
height: 720
tag: ckpt                # 前缀; 最终文件名: <tag>_<agent_stem>_episode_000.mp4
# 录制时禁用 sphere-proxy hard termination, 避免 proxy 接触导致 env reset 后
# 同一个视频拼接多个短 episode. PhysX/table hard contact 仍按 env 默认处理.
clearance_hard: -.inf
capture_backend: replicator # cluster/headless 默认使用离屏相机; 本地可覆盖为 viewport

# --- geom-paper 默认 (verified per memories) ---
# 若录制非 v8 verified ckpt, 这些可在 invocation 时覆盖
geom_stage: insert
geom_d_sat: 0.8          # Mode 1 fix verified; 旧默认 0.30 会让 SAC 在多种 pose 学不动
horizon: 200

# --- 注意 ---
# capture_backend=replicator 是 cluster/headless 安全默认值. 本地想录
# visualize_policy 同口径轨迹时, 可覆盖 train.capture_backend=viewport.
