train_script: scripts/train_sac_lagrangian.py

# LagSAC Stage 2g (preaxis) — B-route safety, 用于 paper-grade chain
#
# 设计原则: 镜像 Stage 1 b_route + Stage 3 b_route 的 CMDP, 但保留 lag_stage2_preaxis_local_tuned.yaml
# 已 verified 的 Stage 2g preaxis 任务 reward (4-channel: d + radial_tip + radial_max + axis).
#
# 与 lag_stage2_preaxis_local_tuned.yaml 唯一差异: CMDP block 从 cost_signal=collision /
# damp_scale=1 / q_cost 切到 B-route clearance signal + rollout_episode_rate + Stage 1/3
# 同款 lr_λ/γ_cost/λ_init.
#
# cost_limit_per_ep 取值依据: Stage 1 (horizon=100) 用 50, Stage 3 (horizon=200) 用 100.
# Stage 2 horizon=150, 按线性 per-step rate 推 75. 允许 rollout cost ~50/ep 不立即 binding.
#
# 用法: tonight chain warmstart 从 Stage 1 b_route best_hold 接.

# Runtime / env count.
num_envs: 16
horizon: 150
render: false
seed: 0
use_axis_resid_obs: true
exclude_ee_from_physx_self_collision: false

n_epochs: 120
n_steps_per_epoch: 2400          # = horizon × num_envs = 150 × 16
n_steps_per_fit: 16
utd: null
critic_warmup_transitions: null
n_eval_episodes: 16

lr_actor: 3e-5
lr_critic: 3e-4
lr_alpha: 3e-4
alpha_max: 0.05
target_entropy: -7
actor_grad_clip: 1.0

initial_joint_noise: 0.1
preinsert_success_pos_threshold: 0.10
preinsert_offset: null

# ── Geom Stage 2g preaxis task (= local_tuned verified) ─────────────────────
geom_stage: preaxis
geom_d_target_neg: -0.08
geom_d_target_pos: 0.03
geom_d_target_ramp_start: 0
geom_d_target_ramp_end: 20

geom_d_sat: 0.30
geom_radial_sat: 1.0

geom_d_th: 0.020
geom_r_tip_th: 0.020
geom_r_max_th: 0.025
geom_axis_th: 0.300
geom_insert_d_ins: 0.025
geom_insert_r_max_th: 0.025
geom_pen_th: 0.001

rew_geom_d: 8.0
rew_geom_radial_tip: 2.0
rew_geom_radial_max: 5.0
rew_geom_axis: 1.2
rew_geom_progress: 0.0
rew_geom_advance: 0.0

geom_gate_radial_sigma: 0.025
geom_gate_axis_sigma: 0.30
geom_gate_penetration_sigma: null
geom_d_gate_mode: "off"

rew_geom_penetration: 0.0

rew_geom_soft_success: 0.0
geom_soft_d_sigma: 0.020
geom_soft_radial_sigma: 0.015
geom_soft_axis_sigma: 0.30
geom_soft_penetration_sigma: null

rew_geom_bad_entry: 0.0
geom_bad_entry_radial_safe: 0.014
geom_bad_entry_axis_safe: 0.10
geom_bad_entry_pen_safe: 0.00075

# ── CMDP cost (B route: sphere=cost, PhysX/table=guard + cliff) ─────────────
# D-ATACOM-style clearance cost = max((margin - min_clearance) / margin, 0).
cost_signal: clearance
clearance_cost_margin: 0.02
clearance_cost_clip_max: null
cost_scale: 1.0

sphere_collision_terminates: false
physx_collision_terminates: true
keep_collision_reward_penalty: true
enable_physx_arm_collision: true
enable_table_collision: true
table_collision_terminates: true
table_z: 0.0
table_clearance_hard: 0.0
table_clearance_cost_margin: 0.03

# ── Lagrangian controller (= Stage 1/3 B-route v4) ──────────────────────────
# cost_limit_per_ep proportional to horizon:
#   Stage 1 (h=100, cost_lim=50)  → 0.5/step
#   Stage 2 (h=150, cost_lim=75)  → 0.5/step ✓
#   Stage 3 (h=200, cost_lim=100) → 0.5/step
cost_limit_per_ep: 75.0
lambda_update_mode: rollout_episode_rate
min_lambda_update_episodes: 16
lr_lambda: 0.005
lambda_max: 20.0
lambda_min: 0.0
init_log_lambda: 0.0              # λ_init = 1.0
damp_scale: 0.0
gamma_cost: 0.7

# Regularization.
rew_action: 0.005
rew_home: 0.00075
home_weights: "1,1,1,1,0.75,0.5,0.5"

terminal_hold_bonus: 0.0
hold_success_steps: 10

# Sphere-proxy 双臂自碰撞 (hard absorbing guard).
# Keep the same arm proxy radius as Stage 1 B-route.  The paper chain should not
# silently change the safety geometry exactly when transferring the S1 policy to
# S2; otherwise cross-stage cost curves are harder to interpret.
clearance_hard: 0.0
proxy_arm_radius: 0.065
proxy_ee_radius: 0.04

# Warm-start (tonight 脚本会覆盖此路径).
load_agent: results/checkpoints/saved/LagSAC_stage1g_prepos_lag_local_compare_20260513/best_hold_lag.msh
actor_only_warmstart: true
keep_replay: false

wandb_project: bimanual_peghole
wandb_entity: miaoxu010522-lund
wandb_run_name: lag_S2g_preaxis_b_route_cost75_lr0p005_120ep_seed0
wandb_group: lag_s2_b_route
no_wandb: false
