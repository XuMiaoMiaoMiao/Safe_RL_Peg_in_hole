train_script: scripts/train_sac_lagrangian.py

# Lagrangian SAC Stage 1g (prepos) — geom_stage 主线冷启动.
#
# 与 sac_stage1_prepos.yaml 的唯一结构差异:
#   collision 从 reward 里的大负奖励剥离为独立 CMDP cost,
#   由 Lagrange 乘子 λ 动态控制安全预算. reward 本身与 SAC 版完全一致.
#
# geom_stage=prepos 自动启用 41D obs (joint_pos[14] + joint_vel[14]
#   + pos_vec[3] + axis_resid[3] + d[1] + radial_vec[3] + peg_in_hole[3]).
# preinsert_offset 由脚本自动同步到 abs(geom_d_target_neg) = 0.08m.
#
# Invariants (README):
#   1. n_steps_per_epoch = horizon × num_envs = 100 × 16 = 1600
#   2. Stage 1g prepos 不接触 hole, 不传 exclude_ee_from_physx_self_collision
#   3. seed=0 (Stage 1g verified successful run)

# Runtime / env count.
num_envs: 16
horizon: 100
render: false
seed: 0
use_axis_resid_obs: true
exclude_ee_from_physx_self_collision: false

# Collection / update cadence.
n_epochs: 120
n_steps_per_epoch: 1600          # = horizon × num_envs = 100 × 16
n_steps_per_fit: 16              # one vector-step per fit at num_envs=16
utd: null                        # defaults to n_steps_per_fit → true UTD ≈ 1
critic_warmup_transitions: null
n_eval_episodes: 16

# Optimizer / entropy (cold-start, mirrors sac_stage1_prepos).
lr_actor: 7e-5
lr_critic: 3e-4
lr_alpha: 3e-4
alpha_max: 0.15
target_entropy: -7               # ≈ -act_dim/2 for 14-DoF cold start
actor_grad_clip: null            # ★ DIAG: 关掉, 跟 SAC Stage 1 对齐 (cold-start 不能 clip)

# Base env.
initial_joint_noise: 0.1
preinsert_success_pos_threshold: 0.10
preinsert_offset: null           # auto-synced to abs(geom_d_target_neg) = 0.08

# Geom Stage 1g reward design (identical to sac_stage1_prepos).
# prepos 只罚轴向深度误差 + tip 单点径向误差, 不加 axis / radial_max 压力.
# 三阶段分工:
#   Stage 1g prepos  : rew_geom_d + rew_geom_radial_tip (本配置)
#   Stage 2g preaxis : + rew_geom_radial_max + rew_geom_axis
#   Stage 3g insert  : + rew_geom_advance (PBRS) + bad_entry; penetration → cost

geom_stage: prepos
geom_d_target_neg: -0.08        # prepos 目标深度 d = -8cm (hole 入口前 8cm)
geom_d_target_pos: 0.03         # insert 模式才用; prepos/preaxis 不读, 但构造时需要合法值
geom_d_target_ramp_start: 0
geom_d_target_ramp_end: 20      # insert 模式 ramp 参数; prepos 阶段不生效

geom_d_sat: 0.30                # 轴向误差 reward 饱和上界 (30cm)
geom_radial_sat: 1.5            # 径向误差 reward 饱和上界 (1.5m)

# 成功判断阈值 (用于 eval metric 与 best_hold ckpt 选择).
geom_d_th: 0.030                # prepos 轴向深度窗口 ±3cm
geom_r_tip_th: 0.030            # tip 单点径向阈值 3cm
geom_r_max_th: 0.030            # 杆身最大径向阈值 (prepos 不用于 mask, 但 env 需非零)
geom_axis_th: 0.400             # 轴对齐阈值 (prepos 不用于 mask)
geom_insert_d_ins: 0.025        # insert 深度阈值 (Stage 3g 用)
geom_insert_r_max_th: 0.025     # insert 杆身径向阈值 (Stage 3g 用)
geom_pen_th: 0.001              # clean step 穿模阈值 1mm

# Reward weights — Stage 1g prepos.
rew_geom_d: 8.0                 # 轴向深度误差线性罚 (prepos 主信号)
rew_geom_radial_tip: 8.0        # tip 单点径向误差线性罚 (prepos 主信号)
rew_geom_radial_max: 0.0        # 杆身整体径向误差罚 (Stage 2g 才开)
rew_geom_axis: 0.0              # 轴对齐误差罚 (Stage 2g 才开)
rew_geom_progress: 0.0          # 对齐门控 state-progress reward (不用)
rew_geom_advance: 0.0           # delta-progress PBRS reward (Stage 3g 才开)

# alignment_gate 参数 (prepos 阶段 gate 权重均为 0, sigma 仍需合法值以通过校验).
geom_gate_radial_sigma: 0.025
geom_gate_axis_sigma: 0.30
geom_gate_penetration_sigma: null  # 不把穿模引入 gate (prepos 阶段)
geom_d_gate_mode: "off"            # 不对 r_geom_d 做 alignment gating

# 穿模软惩罚 (prepos 阶段 peg 不接触 hole, 关闭).
rew_geom_penetration: 0.0

# Soft success dwell well (prepos 阶段关闭).
rew_geom_soft_success: 0.0
geom_soft_d_sigma: 0.020
geom_soft_radial_sigma: 0.015
geom_soft_axis_sigma: 0.30
geom_soft_penetration_sigma: null

# Bad-entry task-ordering 惩罚 (Stage 3g 才有意义, 此处关闭).
rew_geom_bad_entry: 0.0
geom_bad_entry_radial_safe: 0.014
geom_bad_entry_axis_safe: 0.10
geom_bad_entry_pen_safe: 0.00075

# Cost signal: collision 从 reward 剥离为 CMDP cost, λ 动态控制安全预算.
# prepos 阶段 peg 不接近 hole, 主要 cost 来自双臂自碰撞.
cost_signal: collision

# Lagrangian safety hyperparameters.
# DIAGNOSTIC RUN (2026-05-15): 冻结 λ 在最小值, 关掉所有 Lagrangian transient 压力.
# 目的: 验证 LagSAC trainer 在 cost 稀疏时能否 graceful 退化为 SAC.
cost_limit_per_ep: 0.10
lambda_update_mode: rollout_episode_rate  # 用完整 rollout episode cost 更新 λ
min_lambda_update_episodes: 16            # 至少累积一轮并行 episode 再更新
lr_lambda: 0.0                            # ★ 冻结 λ, 不让冷 cost critic 噪声推动它
lambda_max: 100.0
lambda_min: 0.0                           # ★ 允许 log_λ clamp 到 -10
init_log_lambda: -10                      # ★ λ_init ≈ 4.5e-5, 等价于关 Lagrangian
damp_scale: 0.0                           # ★ 关掉 damp (Stage 1 默认 0, 显式写出)
gamma_cost: 0.7                           # cost critic 折扣; 低值让约束更短视、收紧更快

# Regularization.
rew_action: 0.005
rew_home: 0.00075
home_weights: "1,1,1,1,0.75,0.5,0.5"  # 每单臂 7 关节权重; 末端关节权重降低

# Hold-N 仅作 eval 指标; terminal_hold_bonus=0 保持 episode 跑满 horizon,
# 让 dense d/radial 梯度不在 success 后截断.
terminal_hold_bonus: 0.0
hold_success_steps: 10

# Sphere-proxy 双臂自碰撞 (OR 联合 PhysX 接触力).
clearance_hard: 0.0
proxy_arm_radius: 0.06
proxy_ee_radius: 0.04

# Warm-start: Stage 1g 冷启动, 不加载 checkpoint.
load_agent: null
actor_only_warmstart: false
keep_replay: false

wandb_project: bimanual_peghole
wandb_entity: safe_rl_2026_lund
wandb_run_name: lag_S1g_prepos_frozen_lambda_diag_20260515_seed0
wandb_group: lag_geom_diag_frozen_lambda_20260515
no_wandb: false
