train_script: scripts/train_sac_lagrangian.py

# Lagrangian SAC Stage 1g (prepos) — CLEARANCE-CONSTRAINT, FAST λ, clean CMDP
#
# 2026-05-17 设计沿革 (本文件经历 3 版):
#   v1 (16:08): "conservative" — lr_λ=0.001, λ_init=0.10, cost_limit=1.0, λ_max=5.
#     失败: λ 36 epoch 涨 0.001, absorb_sphere 64/epoch 不降, task 完全没学.
#     根因: Δlog_λ ≈ 0.0002/epoch, λ frozen; λ·Q_C 仅 0.05% Q_R, actor 忽略 cost.
#   v2 (16:51): "active" — lr_λ=0.01, λ_init=1.0, γ_cost=0.99.
#     失败: 到 epoch 42 λ≈2.0, absorb_sphere 仍 64/epoch, geom_hold=0.
#   v3 (current): 回到 2026-05-16 两个成功 clean-clearance LagSAC 的控制器区间:
#     lr_λ=0.05, γ_cost=0.7, λ_init=e^1≈2.7, 但保留 D-ATACOM-style no-clip
#     clearance cost; cost_limit 从旧 clipped 的 0.5 放大到 1.5 适配 no-clip 尺度.
#
# 设计原则 (这次坚持):
#   1. ★ NO collision reward cliff (keep_collision_reward_penalty=false)
#      → 与教授原话 "use constraints" 一致, 与 d-atacom 一致, 避免 reward/cost double-count.
#   2. ★ 保留 absorbing termination (clearance_hard=0.0)
#      → simulation stability guard, 防双臂物理嵌入 PhysX. d-atacom air-hockey 任务
#        结构不需要 (双臂自然分离), 我们 peg-in-hole 需要靠近, 必须保留.
#   3. ★ Cost constraint 必须真能动 (两版失败教训)
#      → 成功历史: run-20260516_174954 / run-20260516_164710 都用 lr_λ=0.05,
#        γ_cost=0.7, λ 在 epoch 25-35 达到 4-8 后 absorb_sphere 才降到 0.
#
# Stage 1 SAC baseline (S1g_prepos_h100_full_ep_balanced_seed0) 前 10 epoch absorb_sphere:
#   epoch 2=45, 8=11, 9=3, 10+=0. 用 cliff 学会避碰.
#   LagSAC v2 期望: 类似前期 peak, 但靠 λ 推下来而非 cliff.
#
# 任务 reward 完全同 SAC baseline (rew_geom_d=8, rew_geom_radial_tip=8, 其他 = 0).

# Runtime / env count.
num_envs: 16
horizon: 100
render: false
seed: 0
use_axis_resid_obs: true
exclude_ee_from_physx_self_collision: false

# Collection / update cadence.
n_epochs: 30                      # ★ 30-ep calibration run, 看 λ 轨迹 + cost 量级稳定后扩到 120
n_steps_per_epoch: 1600          # = horizon × num_envs = 100 × 16
n_steps_per_fit: 16
utd: null
critic_warmup_transitions: null
n_eval_episodes: 16

# Optimizer / entropy (与 SAC Stage 1 baseline 一致).
lr_actor: 7e-5
lr_critic: 3e-4
lr_alpha: 3e-4
alpha_max: 0.15
target_entropy: -7
actor_grad_clip: null

# Base env.
initial_joint_noise: 0.1
preinsert_success_pos_threshold: 0.10
preinsert_offset: null

# Geom Stage 1g (prepos) targets.
geom_stage: prepos
geom_d_target_neg: -0.08
geom_d_target_pos: 0.03
geom_d_target_ramp_start: 0
geom_d_target_ramp_end: 20

geom_d_sat: 0.30
geom_radial_sat: 1.5

geom_d_th: 0.030
geom_r_tip_th: 0.030
geom_r_max_th: 0.030
geom_axis_th: 0.400
geom_insert_d_ins: 0.025
geom_insert_r_max_th: 0.025
geom_pen_th: 0.001

# ── Task reward (= SAC Stage 1 baseline) ─────────────────────────────────────
rew_geom_d: 8.0
rew_geom_radial_tip: 8.0
rew_geom_radial_max: 0.0
rew_geom_axis: 0.0
rew_geom_progress: 0.0
rew_geom_advance: 0.0

geom_gate_radial_sigma: 0.025
geom_gate_axis_sigma: 0.30
geom_gate_penetration_sigma: null
geom_d_gate_mode: "off"

rew_geom_penetration: 0.0
rew_geom_soft_success: 0.0
geom_soft_d_sigma: 0.020
geom_soft_radial_sigma: 0.015
geom_soft_axis_sigma: 0.30
geom_soft_penetration_sigma: null

rew_geom_bad_entry: 0.0
geom_bad_entry_radial_safe: 0.014
geom_bad_entry_axis_safe: 0.10
geom_bad_entry_pen_safe: 0.00075

# ── CMDP cost (B route hybrid: sphere=cost, PhysX=guard) ─────────────────────
# D-ATACOM-style clearance cost = max((margin - min_clearance) / margin, 0).
cost_signal: clearance
clearance_cost_margin: 0.02
clearance_cost_clip_max: null
cost_scale: 1.0

# ★★★ B route hybrid (2026-05-17 evening) ★★★
# Sphere proxy   = pure cost signal (no terminate, no cliff)
#                  → continuous safety violation for cost critic + λ
# PhysX contact  = absorbing terminate + cliff
#                  → guards against suicide (cliff makes early-terminate expensive)
#                  → guards against sim instability (real arm-arm overlap)
# Table clearance = geometry proxy hard absorbing + clearance cost
#                  → guards harder/later-stage poses from hitting the tabletop
#
# enable_physx_arm_collision adds capsule colliders to iiwa arm links so PhysX
# arm-arm contact actually triggers (USD has no CollisionAPI on arm links).
# Without it, physx_collision_terminates is dead code.
sphere_collision_terminates: false
physx_collision_terminates: true
keep_collision_reward_penalty: true        # cliff only on PhysX/table (cost env splits)
enable_physx_arm_collision: true
enable_table_collision: true
table_collision_terminates: true
table_z: 0.0
table_clearance_hard: 0.0
table_clearance_cost_margin: 0.03

# ── Lagrangian controller (REVISION 2026-05-17 晚 v4): B route 重标定 ──────────
# 设计沿革:
#   v1 (conservative): lrλ=0.001, init_logλ=-2.3, cost_lim=1.0 → λ 36 epoch 不动
#   v2 (active):       lrλ=0.01,  init_logλ=0,    cost_lim=1.0 → λ 42 epoch λ≈2 仍 fail
#   v3 (fast):         lrλ=0.05,  init_logλ=1,    cost_lim=1.5 → ✓ Stage 1 verified 在旧 sphere absorb 模式
#   v4 (B route):      lrλ=0.005, init_logλ=0,    cost_lim=50  → B route 重标定
#
# B route 标定依据 (smoke run 20260517_2146):
#   sphere_collision_terminates=false 让 episode 跑满 100 步 (不再被 sphere absorb 截断),
#   rollout_ep_cost 量级从旧 1.5 跳到 0-263 (epoch 2 达 263.6, 因为大量 sphere overlap 不再终止).
#   旧 cost_limit=1.5 在 B route 下 → λ epoch 2 直接顶 lambda_max=20.
#
# 新计算:
#   平均 cost 估计:   rollout 中位值约 ~50 (smoke ep 1-5 mean)
#   cost_limit_per_ep=50: 允许 binding 但不立即暴冲
#   lr_lambda=0.005:  violation 早期 50-200 → Δlog_λ ≈ 0.25-1.0/epoch (合理 ramp)
#   λ_max=20:         维持 (避免 actor 被 λ·Q_C 完全压死)
#   init_log_lambda=0: λ_init=1.0 (比 v3 的 2.7 温和, 起步不立即扰动 actor)
#   γ_cost=0.7:       保留 (v3 verified 短视 critic 有效)
cost_limit_per_ep: 50.0
lambda_update_mode: rollout_episode_rate
min_lambda_update_episodes: 16
lr_lambda: 0.005                 # ★ B route 量级 ~30x, lr 同比例缩
lambda_max: 20.0                 # 保留 v3 设置
lambda_min: 0.0
init_log_lambda: 0.0             # ★ λ_init=1 (从 v3 的 2.7 降, 起步温和)
damp_scale: 0.0
gamma_cost: 0.7                  # 保留 v3 verified

# Regularization.
rew_action: 0.005
rew_home: 0.00075
home_weights: "1,1,1,1,0.75,0.5,0.5"

terminal_hold_bonus: 0.0
hold_success_steps: 10

# Sphere-proxy 双臂自碰撞 (hard absorbing guard, 独立于 cost signal).
clearance_hard: 0.0
proxy_arm_radius: 0.065
proxy_ee_radius: 0.04

# Cold-start (no warm-start, 同 SAC Stage 1 baseline).
load_agent: null
actor_only_warmstart: false
keep_replay: false

wandb_project: bimanual_peghole
wandb_entity: miaoxu010522-lund
wandb_run_name: lag_S1g_b_route_v4_cost50_lr0p005_calib30ep_seed0
wandb_group: lag_s1_b_route_v4_calibration
no_wandb: false
