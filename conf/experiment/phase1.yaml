train_script: scripts/train_sac.py

# SAC Stage 1: preinsert position only.
#
# Matches DualArmPegHoleEnv normal reward path (geom_stage=None):
#   full_success = pos_err < preinsert_success_pos_threshold
#   axis reward   = off
#   axis success  = ignored by success_axis_threshold=inf
#
# Keep use_axis_resid_obs=true even though Stage 1 does not reward axis. This
# gives a 34D checkpoint that can warm-start Stage 2 without changing obs_dim.

# Runtime / env count.
num_envs: 16
horizon: null              # env default: 150
render: false
seed: 42
use_axis_resid_obs: true

# SAC collection / update cadence.
n_epochs: 50
n_steps_per_epoch: 1024
n_steps_per_fit: 16        # one vector-step per fit at num_envs=16
utd: null                  # defaults to n_steps_per_fit -> true UTD ~= 1
critic_warmup_transitions: null
n_eval_episodes: 16

# Optimizer / entropy settings verified for the 14-DoF Stage 1 task.
lr_actor: 1e-4
lr_critic: 3e-4
lr_alpha: 3e-4
alpha_max: 0.05
target_entropy: -7

# DualArmPegHoleEnv task settings.
initial_joint_noise: 0.1
preinsert_offset: 0.05
preinsert_success_pos_threshold: 0.10

rew_axis: 0.0
success_axis_threshold: .inf
axis_gate_radius: .inf

rew_success: 2.0
rew_pos_success: 0.0
rew_action: 0.005
rew_home: 0.0005
home_weights: null         # env default: 14 weights all 1.0

# Hold-N is an eval metric only. terminal_hold_bonus=0 keeps training episodes
# running to horizon so dense pos_err gradients do not stop at the threshold.
terminal_hold_bonus: 0.0
hold_success_steps: 10

# Sphere-proxy self-collision fallback, OR'ed with PhysX contact force.
clearance_hard: 0.0
proxy_arm_radius: 0.06
proxy_ee_radius: 0.04

wandb_project: bimanual_peghole
wandb_entity: safe_rl_2026_lund
wandb_run_name: SAC_phase1_pos_only_seed42
wandb_group: phase1_seed_sweep
no_wandb: false
