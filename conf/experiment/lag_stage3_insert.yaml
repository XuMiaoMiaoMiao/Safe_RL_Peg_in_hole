train_script: scripts/train_sac_lagrangian.py

# Lagrangian SAC Stage 3g (insert) — from Stage 2g actor warm-start.
#
# 目标: peg 真正进入 hole (d > geom_insert_d_ins = 2.5cm), radial_max + penetration 达标.
# reward 与 SAC v8 (5-channel) 一致: advance + dwell + linear radial/axis.
# 关键差异: rew_geom_penetration=0 (不在 reward 里罚), penetration 改为 CMDP cost.
# rew_geom_bad_entry=0: bad_entry 的 task ordering 由 λ·Q_C 隐式提供.
#
# Invariants (README):
#   1. n_steps_per_epoch = horizon × num_envs = 200 × 16 = 3200
#   2. exclude_ee_from_physx_self_collision 必传
#   3. seed=1 (verified)

# Runtime / env count.
num_envs: 16
horizon: 200
render: false
seed: 1
use_axis_resid_obs: true
exclude_ee_from_physx_self_collision: true

# Collection / update cadence.
n_epochs: 80
n_steps_per_epoch: 3200          # = horizon × num_envs = 200 × 16
n_steps_per_fit: 16              # one vector-step per fit at num_envs=16
utd: null                        # defaults to n_steps_per_fit → true UTD ≈ 1
critic_warmup_transitions: 30000
n_eval_episodes: 16

# SAC v8 verified insert recipe: low actor LR + low alpha cap.
lr_actor: 1e-5
lr_critic: 3e-4
lr_alpha: 3e-4
alpha_max: 0.015
target_entropy: -7
actor_grad_clip: 1.0             # Lagrangian SAC actor 梯度裁剪 (λ 大时防爆)

# Base env.
initial_joint_noise: 0.1
preinsert_success_pos_threshold: 0.10
preinsert_offset: null           # auto-synced to abs(geom_d_target_neg) = 0.08

# Geom Stage 3g reward design.
# 三阶段分工:
#   Stage 1g prepos  : rew_geom_d + rew_geom_radial_tip
#   Stage 2g preaxis : + rew_geom_radial_max + rew_geom_axis + soft_success dwell
#   Stage 3g insert  : + rew_geom_advance (PBRS) + bad_entry; penetration → cost (本配置)

geom_stage: insert
geom_d_target_neg: -0.08
geom_d_target_pos: 0.03
geom_d_target_ramp_start: 0
geom_d_target_ramp_end: 20      # 前 20 epoch 线性将 d_target 从 -8cm ramp 到 +3cm
geom_progress_floor: 0.0        # PBRS progress 下界 (防负奖励截断)

geom_d_sat: 0.30
geom_radial_sat: 1.0

# 成功判断阈值.
geom_d_th: 0.020
geom_r_tip_th: 0.015
geom_r_max_th: 0.025
geom_axis_th: 0.300
geom_insert_d_ins: 0.025        # 插入深度阈值 2.5cm
geom_insert_r_max_th: 0.025
geom_pen_th: 0.001              # clean step 穿模阈值 1mm

# Reward weights — Stage 3g insert (mirrors SAC v8).
rew_geom_d: 1.0                 # 轴向深度误差线性罚 (降权, advance 主导推进; mirrors SAC v8)
rew_geom_radial_tip: 0.0        # tip radial 关闭; radial_max 覆盖
rew_geom_radial_max: 5.0        # 杆身整体径向线性罚 (always-on)
rew_geom_axis: 1.0              # 轴对齐线性罚 (always-on)
rew_geom_progress: 0.0
rew_geom_advance: 25.0          # delta-progress PBRS (主推进信号, 对齐门控)

# alignment_gate 参数 (用于 rew_geom_advance 的 gate).
geom_gate_radial_sigma: 0.025
geom_gate_axis_sigma: 0.30
geom_gate_penetration_sigma: 0.005  # penetration 也进 gate, 避免穿模时拿 advance 奖励
geom_d_gate_mode: "off"

# 穿模软惩罚关闭: penetration 改为 CMDP cost (cost_signal=penetration).
rew_geom_penetration: 0.0

# Soft success dwell well (4-项 Gaussian, 含 penetration).
rew_geom_soft_success: 1.25
geom_soft_d_sigma: 0.018
geom_soft_radial_sigma: 0.009
geom_soft_axis_sigma: 0.15
geom_soft_penetration_sigma: 0.0025  # dwell well 同样要求无穿模

# Bad-entry task-ordering 惩罚关闭: λ·Q_C 隐式提供 ordering.
rew_geom_bad_entry: 0.0
geom_bad_entry_radial_safe: 0.014
geom_bad_entry_axis_safe: 0.10
geom_bad_entry_pen_safe: 0.00075

# Cost signal: penetration 连续量作为 CMDP cost (替代 SAC v8 的 rew_geom_penetration).
# cost_signal=penetration → info["cost"] = penetration_max (米, clamp 到 4mm).
cost_signal: penetration

# Lagrangian safety hyperparameters.
# cost_limit_per_ep: episode 内 penetration_max 累积量 (米·步).
# 建议标定: 用 Stage 2g eval 跑 eval_ep_cost 后取 0.5× 作为初始预算.
cost_limit_per_ep: 0.002
lambda_update_mode: rollout_episode_rate  # 用完整 rollout episode cost 更新 λ
min_lambda_update_episodes: 16            # 至少累积一轮并行 episode 再更新
lr_lambda: 5.0                            # penetration cost 量级小, λ 学习率适当偏高
lambda_max: 300.0                         # penetration cost 单位小, λ 需要更大范围
lambda_min: 0.05
init_log_lambda: 1.0                      # λ_init = exp(1) ≈ 2.7
gamma_cost: null                          # cost critic 复用 env 默认折扣 γ=0.99

# Regularization.
rew_action: 0.005
rew_home: 0.001
home_weights: "1,1,1,1,0.75,0.5,0.5"

# Hold-N 仅作 eval 指标; terminal_hold_bonus=0 保持 episode 跑满 horizon.
terminal_hold_bonus: 0.0
hold_success_steps: 10

# Sphere-proxy 双臂自碰撞 (OR 联合 PhysX 接触力).
clearance_hard: 0.0
proxy_arm_radius: 0.06
proxy_ee_radius: 0.04

# Warm-start: Stage 2g best_hold checkpoint (actor-only).
load_agent: results/best_hold_lag.msh
actor_only_warmstart: true
keep_replay: false

wandb_project: bimanual_peghole
wandb_entity: safe_rl_2026_lund
wandb_run_name: lag_S3g_insert_from_stage2_seed1
wandb_group: lag_geom_stage3_insert
no_wandb: false
