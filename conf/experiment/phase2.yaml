train_script: scripts/train_sac.py

# SAC Stage 2: preinsert position + axis alignment.
#
# Matches the current DualArmPegHoleEnv Stage 2 normal reward:
#   full_success = (pos_err < 0.10) AND (axis_err < 0.50)
#   axis reward   = -0.5 * axis_gate(pos_err) * axis_err
#   pos anchor    = +rew_pos_success while pos_err stays inside threshold
#
# This is an actor-only warm-start from a 34D Stage 1 checkpoint. Critic, alpha,
# optimizers and replay are rebuilt under the Stage 2 reward semantics.

# Runtime / env count.
num_envs: 16
horizon: null              # env default: 150
render: false
seed: 42
use_axis_resid_obs: true   # must match the Stage 1 checkpoint obs_dim

# SAC collection / update cadence.
n_epochs: 200
n_steps_per_epoch: 2400
n_steps_per_fit: 16
utd: null                  # defaults to n_steps_per_fit -> true UTD ~= 1
critic_warmup_transitions: 50000
n_eval_episodes: 16

# Conservative warm-start optimizer / entropy settings.
lr_actor: 5e-5
lr_critic: 3e-4
lr_alpha: 3e-4
alpha_max: 0.05
target_entropy: -10

# DualArmPegHoleEnv task settings.
initial_joint_noise: 0.1
preinsert_offset: 0.05
preinsert_success_pos_threshold: 0.10

rew_axis: 0.5
success_axis_threshold: 0.50
axis_gate_radius: 0.40

rew_success: 2.0
rew_pos_success: 1.0
rew_action: 0.005
rew_home: 0.0005
home_weights: null         # env default: 14 weights all 1.0

# Hold-N is an eval metric only. terminal_hold_bonus=0 keeps the shaped
# pos/axis gradients active until horizon.
terminal_hold_bonus: 0.0
hold_success_steps: 10

# Sphere-proxy self-collision fallback, OR'ed with PhysX contact force.
clearance_hard: 0.0
proxy_arm_radius: 0.06
proxy_ee_radius: 0.04

# Warm-start controls. Override load_agent when changing seed or checkpoint.
load_agent: results/checkpoints/2026-05-10/10-06-17/best_agent.msh
actor_only_warmstart: true
keep_replay: false

wandb_project: bimanual_peghole
wandb_entity: safe_rl_2026_lund
wandb_run_name: SAC_phase2_axis_seed42
wandb_group: phase2_actor_warmstart
no_wandb: false
