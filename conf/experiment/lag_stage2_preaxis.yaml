train_script: scripts/train_sac_lagrangian.py

# Lagrangian SAC Stage 2g (preaxis) — from Stage 1g actor warm-start.
#
# 与 sac_stage2_preaxis.yaml 的唯一结构差异:
#   collision 从 reward 里的大负奖励剥离为独立 CMDP cost,
#   由 Lagrange 乘子 λ 动态控制安全预算. reward 本身与 SAC 版完全一致.
#
# 目标: prepos mask (d + radial_tip) AND 整根 peg 径向 (radial_max) + 轴对齐 (axis_err).
#
# Invariants (README):
#   1. n_steps_per_epoch = horizon × num_envs = 150 × 16 = 2400
#   2. Stage 2g preaxis 仍在 hole 外, 不传 exclude_ee_from_physx_self_collision
#   3. actor_only_warmstart + critic_warmup_transitions=50000
#   4. seed=0 (mirrors SAC Stage 2g)

# Runtime / env count.
num_envs: 16
horizon: 150
render: false
seed: 0
use_axis_resid_obs: true
exclude_ee_from_physx_self_collision: false

# Collection / update cadence.
n_epochs: 120
n_steps_per_epoch: 2400          # = horizon × num_envs = 150 × 16
n_steps_per_fit: 16              # one vector-step per fit at num_envs=16
utd: null                        # defaults to n_steps_per_fit → true UTD ≈ 1
critic_warmup_transitions: 50000
n_eval_episodes: 16

# Conservative actor-only warm-start settings (mirrors sac_stage2_preaxis).
lr_actor: 3e-5
lr_critic: 3e-4
lr_alpha: 3e-4
alpha_max: 0.05
target_entropy: -7
actor_grad_clip: null            # ★ DIAG: 关掉, 跟 SAC Stage 2 对齐

# Base env.
initial_joint_noise: 0.1
preinsert_success_pos_threshold: 0.10
preinsert_offset: null           # auto-synced to abs(geom_d_target_neg) = 0.08

# Geom Stage 2g reward design (identical to sac_stage2_preaxis).
# 三阶段分工:
#   Stage 1g prepos  : rew_geom_d + rew_geom_radial_tip
#   Stage 2g preaxis : + rew_geom_radial_max + rew_geom_axis (本配置)
#   Stage 3g insert  : + rew_geom_advance (PBRS) + bad_entry; penetration → cost

geom_stage: preaxis
geom_d_target_neg: -0.08        # preaxis 目标深度 d = -8cm (hole 入口前 8cm)
geom_d_target_pos: 0.03         # insert 模式才用; preaxis 不读, 但构造时需要合法值
geom_d_target_ramp_start: 0
geom_d_target_ramp_end: 20      # insert 模式 ramp 参数; preaxis 阶段不生效

geom_d_sat: 0.30
geom_radial_sat: 1.0

# 成功判断阈值 (用于 eval metric 与 best_hold ckpt 选择).
geom_d_th: 0.020                # preaxis 轴向深度窗口收紧到 ±2cm
geom_r_tip_th: 0.020            # tip 单点径向阈值 2cm
geom_r_max_th: 0.025
geom_axis_th: 0.300
geom_insert_d_ins: 0.025
geom_insert_r_max_th: 0.025
geom_pen_th: 0.001

# Reward weights — Stage 2g preaxis (mirrors sac_stage2_preaxis).
rew_geom_d: 8.0                 # 轴向深度误差线性罚
rew_geom_radial_tip: 2.0        # tip 单点径向误差线性罚
rew_geom_radial_max: 5.0        # 杆身整体径向误差罚 (Stage 2g 新增主信号)
rew_geom_axis: 1.2              # 轴对齐误差罚 (Stage 2g 新增主信号)
rew_geom_progress: 0.0
rew_geom_advance: 0.0           # delta-progress PBRS (Stage 3g 才开)

# alignment_gate 参数.
geom_gate_radial_sigma: 0.025
geom_gate_axis_sigma: 0.30
geom_gate_penetration_sigma: null
geom_d_gate_mode: "off"

# 穿模软惩罚 (preaxis 阶段 peg 不接触 hole, 关闭).
rew_geom_penetration: 0.0

# Soft success dwell well (preaxis 阶段关闭).
rew_geom_soft_success: 0.0
geom_soft_d_sigma: 0.020
geom_soft_radial_sigma: 0.015
geom_soft_axis_sigma: 0.30
geom_soft_penetration_sigma: null

# Bad-entry task-ordering 惩罚 (Stage 3g 才有意义, 此处关闭).
rew_geom_bad_entry: 0.0
geom_bad_entry_radial_safe: 0.014
geom_bad_entry_axis_safe: 0.10
geom_bad_entry_pen_safe: 0.00075

# Cost signal: preaxis 阶段 peg 不接触 hole, 主要 cost 来自双臂自碰撞.
# keep_collision_reward_penalty=true 让 λ≈0 时退化成普通 SAC.
cost_signal: collision
keep_collision_reward_penalty: true

# Lagrangian safety hyperparameters.
# DIAGNOSTIC RUN (2026-05-15): 冻结 λ 在最小值, 关掉所有 Lagrangian transient 压力.
# 目的: 验证 LagSAC trainer 在 cost 稀疏时能否 graceful 退化为 SAC.
cost_limit_per_ep: 0.75
lambda_update_mode: q_cost
damp_scale: 0.0                           # ★ 关掉 damp 噪声注入 actor
min_lambda_update_episodes: 16            # 至少累积一轮并行 episode 再更新
lr_lambda: 0.0                            # ★ 冻结 λ
lambda_max: 20.0
lambda_min: 0.0
init_log_lambda: -10                      # ★ λ_init ≈ 4.5e-5
gamma_cost: 0.7

# Regularization.
rew_action: 0.005
rew_home: 0.00075
home_weights: "1,1,1,1,0.75,0.5,0.5"

# Hold-N 仅作 eval 指标; terminal_hold_bonus=0 保持 episode 跑满 horizon.
terminal_hold_bonus: 0.0
hold_success_steps: 10

# Sphere-proxy 双臂自碰撞 (OR 联合 PhysX 接触力).
clearance_hard: 0.0
proxy_arm_radius: 0.06
proxy_ee_radius: 0.04

# Warm-start: Stage 1g Lagrangian best_hold checkpoint (actor-only).
load_agent: results/best_hold_lag.msh
actor_only_warmstart: true
keep_replay: false

wandb_project: bimanual_peghole
wandb_entity: safe_rl_2026_lund
wandb_run_name: lag_S2g_preaxis_frozen_lambda_diag_20260515_seed0
wandb_group: lag_geom_diag_frozen_lambda_20260515
no_wandb: false
