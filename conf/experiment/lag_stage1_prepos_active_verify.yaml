train_script: scripts/train_sac_lagrangian.py

# Lagrangian SAC Stage 1g (prepos) — ACTIVE verify (2026-05-16).
#
# 目标: 在 cold-start 验证 active Lagrangian 机制是否健康.
#   - 冷 actor 早期会双臂自碰撞 (real cost signal)
#   - λ 应被 dual ascent 真实拉起来 (而不是死在 floor)
#   - 一旦 policy 学会避碰 (collision drop to 0), λ 应自动衰减回 floor
#   - best_J / best_geom 应接近 SAC Stage 1 reference (-85 / 65)
#
# 跟 frozen diagnostic (lag_stage1_prepos.yaml) 的差异仅在 Lagrangian block:
#   lr_lambda:  0.0  → 5e-2   (允许 dual ascent)
#   其它 hyperparameter 与 frozen 完全一致, 避免引入混淆变量
#
# Invariants:
#   1. n_steps_per_epoch = horizon × num_envs = 100 × 16 = 1600
#   2. Stage 1g prepos 不接触 hole, 不传 exclude_ee_from_physx_self_collision
#   3. seed=0 (跟 SAC Stage 1g / frozen diagnostic 一致, 便于对比)

# Runtime / env count.
num_envs: 16
horizon: 100
render: false
seed: 0
use_axis_resid_obs: true
exclude_ee_from_physx_self_collision: false

# Collection / update cadence.
n_epochs: 120
n_steps_per_epoch: 1600          # = horizon × num_envs = 100 × 16
n_steps_per_fit: 16              # one vector-step per fit at num_envs=16
utd: null                        # defaults to n_steps_per_fit → true UTD ≈ 1
critic_warmup_transitions: null
n_eval_episodes: 16

# Optimizer / entropy (cold-start, mirrors sac_stage1_prepos).
lr_actor: 7e-5
lr_critic: 3e-4
lr_alpha: 3e-4
alpha_max: 0.15
target_entropy: -7               # ≈ -act_dim/2 for 14-DoF cold start
actor_grad_clip: null            # 跟 SAC 对齐, cold-start 不能 clip

# Base env.
initial_joint_noise: 0.1
preinsert_success_pos_threshold: 0.10
preinsert_offset: null

geom_stage: prepos
geom_d_target_neg: -0.08
geom_d_target_pos: 0.03
geom_d_target_ramp_start: 0
geom_d_target_ramp_end: 20

geom_d_sat: 0.30
geom_radial_sat: 1.5

geom_d_th: 0.030
geom_r_tip_th: 0.030
geom_r_max_th: 0.030
geom_axis_th: 0.400
geom_insert_d_ins: 0.025
geom_insert_r_max_th: 0.025
geom_pen_th: 0.001

# Reward weights — Stage 1g prepos (跟 SAC / frozen 一致).
rew_geom_d: 8.0
rew_geom_radial_tip: 8.0
rew_geom_radial_max: 0.0
rew_geom_axis: 0.0
rew_geom_progress: 0.0
rew_geom_advance: 0.0

geom_gate_radial_sigma: 0.025
geom_gate_axis_sigma: 0.30
geom_gate_penetration_sigma: null
geom_d_gate_mode: "off"

rew_geom_penetration: 0.0
rew_geom_soft_success: 0.0
geom_soft_d_sigma: 0.020
geom_soft_radial_sigma: 0.015
geom_soft_axis_sigma: 0.30
geom_soft_penetration_sigma: null

rew_geom_bad_entry: 0.0
geom_bad_entry_radial_safe: 0.014
geom_bad_entry_axis_safe: 0.10
geom_bad_entry_pen_safe: 0.00075

# CMDP cost signal: collision 同时作为约束 cost; reward 中仍保留 SAC 的
# collision hard penalty (默认 keep_collision_reward_penalty=true), 便于和
# frozen/SAC 对齐，只验证 active λ 是否健康。
cost_signal: collision

# Lagrangian — ACTIVE.
# cost_limit_per_ep: 0.10 = 每集平均允许 0.10 次双臂自碰撞.
#   cold-start 自然碰撞率远高 (early epoch 多次/ep), 触发 violation 拉 λ;
#   policy 学会后碰撞 → 0, violation < 0, λ 自动衰减回 floor.
#   既不会太严卡死任务 (≥0 任意小都允许收敛), 也不会太松永远不触发.
# lambda_update_mode=rollout_episode_rate: 用 EpisodeCostTracker 收集的真实
#   完整 episode cost sum 更新 λ (一阶信号, 不依赖冷 cost critic 估计).
# init_log_lambda=-10: λ_init ≈ 4.5e-5. C-soft 守卫初始触发 (actor loss = SAC).
#   一旦 dual ascent 把 log_λ 推过 -9.9, 完整 LagSAC 接管.
# damp_scale=0.0: 先验证最简单的 active 路径, damp 留作后续 ablation.
cost_limit_per_ep: 0.10
lambda_update_mode: rollout_episode_rate
min_lambda_update_episodes: 16
lr_lambda: 5e-2                  # ★ 允许 dual ascent (vs frozen=0.0)
lambda_max: 100.0
lambda_min: 0.0
init_log_lambda: -10
damp_scale: 0.0
gamma_cost: 0.7

# Regularization (跟 SAC / frozen 一致).
rew_action: 0.005
rew_home: 0.00075
home_weights: "1,1,1,1,0.75,0.5,0.5"

terminal_hold_bonus: 0.0
hold_success_steps: 10

clearance_hard: 0.0
proxy_arm_radius: 0.06
proxy_ee_radius: 0.04

# Cold-start, 不加载 checkpoint.
load_agent: null
actor_only_warmstart: false
keep_replay: false

wandb_project: bimanual_peghole
wandb_entity: safe_rl_2026_lund
wandb_run_name: lag_S1g_prepos_active_verify_20260516_seed0
wandb_group: lag_geom_stage1_active_verify_20260516
no_wandb: false
